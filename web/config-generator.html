<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embellish Chat Config Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // Lucide Icons Wrapper
        const { 
            Save, Upload, Plus, Trash2, Settings, 
            MessageSquare, AtSign, Palette, FileJson, 
            ChevronDown, ChevronRight, Copy, Check, X,
            Clock, RotateCcw
        } = lucide;

        // Custom Lucide Icon Component for React
        const LucideIcon = ({ icon, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            });
            const IconComponent = lucide.icons[icon];
            if (!IconComponent) return null;
            
            // Render placeholder that lucide.createIcons will fill
            return <i data-lucide={icon} className={className} width={size} height={size}></i>;
        };

        // Re-implementing icons as React components using the lucide library object
        // Since we are in a browser environment without the react-lucide package
        const IconWrapper = ({ name, size, className }) => {
             // Simple SVG rendering for browser environment
             // Mapping standard names to what's available in global lucide object
             const iconName = name.charAt(0).toLowerCase() + name.slice(1);
             return <i data-lucide={name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()} className={className} width={size} height={size}></i>;
        };

        // React Hooks
        const { useState, useEffect } = React;

        // --- Constants & Defaults ---

        const STYLE_TYPES = [
            "METADATA", "LOG", "COLOR_HEX", "COLOR_RAINBOW", "COLOR_GRADIENT", 
            "COLOR_PRESET", "COLOR_SHADOW", "COLOR_TEAM",
            "COMMAND_RUN", "CLICK_COMMAND_RUN", "CLICK_COMMAND_SUGGEST", "CLICK_COPY",
            "HOVER_TEXT", "HOVER_ITEM", "FONT", "URL",
            "BOLD", "ITALIC", "UNDERLINE", "STRIKETHROUGH", "OBFUSCATED", 
            "REPLACE", "MASK", "UPPER", "LOWER", "JSON"
        ];

        const MENTION_TYPES = [
            "PLAYER", "TEAM", "INSIDE", "EVERYONE", "LUCK_PERMS_GROUP", "WORLD"
        ];

        const DEFAULT_CONFIG = {
            version: "2.5.0",
            stylingRules: {
                "embellish-chat.chat": [
                    {
                        pattern: "\\[([^\\]]+?)]\\((https://.*?)\\)",
                        styles: [{ styleType: "URL", preset: "" }]
                    },
                    {
                        pattern: "\\[([^\\]]+?)]\\{(.*?)}",
                        styles: [{ styleType: "FONT", preset: "" }]
                    },
                    {
                        pattern: "\\[([^\\]]+?)]<(#.{6})>",
                        styles: [{ styleType: "COLOR_HEX", preset: "" }]
                    },
                    {
                        pattern: "\\[([^\\]]+?)]<(#.{6,})>",
                        styles: [{ styleType: "COLOR_GRADIENT", preset: "" }]
                    },
                    {
                        pattern: "\\[([^\\]]+?)]<([a-z\\s]+?)>",
                        styles: [{ styleType: "COLOR_PRESET", preset: "" }]
                    },
                    {
                        pattern: "\\*\\*(.+?)\\*\\*()",
                        styles: [{ styleType: "BOLD", preset: "" }]
                    },
                    {
                        pattern: "__(.+?)__()",
                        styles: [{ styleType: "UNDERLINE", preset: "" }]
                    },
                    {
                        pattern: "_(.+?)_()",
                        styles: [{ styleType: "ITALIC", preset: "" }]
                    },
                    {
                        pattern: "~~(.+?)~~()",
                        styles: [{ styleType: "STRIKETHROUGH", preset: "" }]
                    },
                    {
                        pattern: "\\|\\|(.+?)\\|\\|()",
                        styles: [{ styleType: "OBFUSCATED", preset: "" }]
                    },
                    {
                        pattern: "\\[([^\\]]+?)]<(RAINBOW)>",
                        styles: [{ styleType: "COLOR_RAINBOW", preset: "0.7" }]
                    },
                    {
                        pattern: "(.+)()",
                        styles: [{ styleType: "METADATA", preset: "" }]
                    }
                ],
                "embellish-chat.command_argument": []
            },
            mentionRules: {
                "embellish-chat.mention": [
                    {
                        pattern: "@here()",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "INSIDE", preset: "64" }],
                        styles: [
                            { styleType: "BOLD", preset: "" },
                            { styleType: "COLOR_PRESET", preset: "light purple" }
                        ]
                    },
                    {
                        pattern: "@everyone()",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "EVERYONE", preset: "" }],
                        styles: [
                            { styleType: "BOLD", preset: "" },
                            { styleType: "COLOR_PRESET", preset: "light purple" }
                        ]
                    },
                    {
                        pattern: "@team\\((.+?)\\)",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "TEAM", preset: "" }],
                        styles: [{ styleType: "BOLD", preset: "" }]
                    },
                    {
                        pattern: "@group\\((.+?)\\)",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "LUCK_PERMS_GROUP", preset: "" }],
                        styles: [
                            { styleType: "BOLD", preset: "" },
                            { styleType: "COLOR_PRESET", preset: "light purple" }
                        ]
                    },
                    {
                        pattern: "@world\\((.+?)\\)",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "WORLD", preset: "" }],
                        styles: [
                            { styleType: "BOLD", preset: "" },
                            { styleType: "COLOR_PRESET", preset: "light purple" }
                        ]
                    },
                    {
                        pattern: "@([A-Za-z0-9_]{1,16})(?=\\b|\\s|$)",
                        sound: "minecraft:entity.experience_orb.pickup",
                        pitch: 1.75,
                        title: "%player:displayname% mentioned you",
                        cooldown: 0,
                        mentions: [{ mentionType: "PLAYER", preset: "" }],
                        styles: [{ styleType: "BOLD", preset: "" }]
                    }
                ]
            },
            delimiter: ",",
            timestamp: "yyyy-MM-dd HH:mm:ss",
            urlColor: "#0000EE",
            colorPreset: {
                "black": "#000000",
                "dark blue": "#0000AA",
                "dark green": "#00AA00",
                "dark aqua": "#00AAAA",
                "dark red": "#AA0000",
                "dark purple": "#AA00AA",
                "gold": "#FFAA00",
                "gray": "#AAAAAA",
                "dark gray": "#555555",
                "blue": "#5555FF",
                "green": "#55FF55",
                "aqua": "#55FFFF",
                "red": "#FF5555",
                "light purple": "#FF55FF",
                "yellow": "#FFFF55",
                "white": "#FFFFFF"
            },
            defaultTeamColor: "#FF55FF",
            notificationCommandEnable: true,
            bannedPlayerList: [],
            notificationOffPlayerList: []
        };

        // --- Helper Components ---

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = "primary", size = "md", className = "", disabled = false }) => {
            const baseStyles = "flex items-center justify-center font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1";
            const variants = {
                primary: "bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200 focus:ring-slate-500",
                danger: "bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-900/30 dark:hover:bg-red-900/50 dark:text-red-400 focus:ring-red-500",
                ghost: "bg-transparent hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200",
            };
            const sizes = {
                sm: "px-2 py-1 text-xs",
                md: "px-4 py-2 text-sm",
                icon: "p-2",
            };

            return (
                <button 
                    type="button"
                    onClick={onClick} 
                    className={`${baseStyles} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
                    disabled={disabled}
                >
                    {children}
                </button>
            );
        };

        const DeleteButton = ({ onDelete, label = "Delete", size = "sm", className = "" }) => {
            const [isConfirming, setIsConfirming] = useState(false);

            useEffect(() => {
                let timeout;
                if (isConfirming) {
                    timeout = setTimeout(() => setIsConfirming(false), 3000); 
                }
                return () => clearTimeout(timeout);
            }, [isConfirming]);

            return (
                <Button 
                    variant="danger" 
                    size={size}
                    className={className}
                    onClick={(e) => {
                        e.stopPropagation();
                        if (isConfirming) {
                            onDelete();
                            setIsConfirming(false);
                        } else {
                            setIsConfirming(true);
                        }
                    }}
                >
                    {isConfirming ? "Confirm?" : label}
                </Button>
            );
        };

        const AddGroupInput = ({ onAdd, placeholder }) => {
            const [value, setValue] = useState("");

            const handleAdd = () => {
                if (value.trim()) {
                    onAdd(value.trim());
                    setValue("");
                }
            };

            return (
                <div className="flex items-center space-x-2">
                    <input
                        type="text"
                        value={value}
                        onChange={(e) => setValue(e.target.value)}
                        placeholder={placeholder}
                        className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 dark:text-white flex-1 md:flex-none md:w-64"
                        onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
                    />
                    <Button size="sm" onClick={handleAdd} disabled={!value.trim()}>
                        <IconWrapper name="plus" size={16} className="mr-1" /> Add
                    </Button>
                </div>
            );
        };

        const Input = ({ label, value, onChange, placeholder, type = "text", className = "", step = "any" }) => (
            <div className={`flex flex-col space-y-1 ${className}`}>
                {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
                <input
                    type={type}
                    step={step}
                    value={value || ""}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:text-white"
                />
            </div>
        );

        const Combobox = ({ label, value, onChange, options, className = "", placeholder = "" }) => {
            const [listId] = useState(() => "datalist-" + Math.random().toString(36).substr(2, 9));
            
            return (
                <div className={`flex flex-col space-y-1 ${className}`}>
                    {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
                    <input
                        list={listId}
                        value={value || ""}
                        onChange={(e) => onChange(e.target.value)}
                        className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:text-white"
                        placeholder={placeholder}
                    />
                    <datalist id={listId}>
                        {options.map((opt) => (
                            <option key={opt} value={opt} />
                        ))}
                    </datalist>
                </div>
            );
        };

        const ColorPicker = ({ label, value, onChange }) => (
            <div className="flex flex-col space-y-1">
                {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
                <div className="flex items-center space-x-2">
                    <input
                        type="color"
                        value={value || "#000000"}
                        onChange={(e) => onChange(e.target.value)}
                        className="h-9 w-9 p-0.5 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 cursor-pointer"
                    />
                    <input
                        type="text"
                        value={value || ""}
                        onChange={(e) => onChange(e.target.value)}
                        className="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm font-mono dark:text-white"
                        placeholder="#RRGGBB"
                    />
                </div>
            </div>
        );

        const Accordion = ({ title, children, defaultOpen = false, onDelete }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="border border-slate-200 dark:border-slate-700 rounded-lg mb-2 overflow-hidden">
                    <div 
                        className="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-800/50 cursor-pointer select-none"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <div className="flex items-center space-x-2 overflow-hidden">
                            {isOpen ? <IconWrapper name="chevron-down" size={16} className="flex-shrink-0" /> : <IconWrapper name="chevron-right" size={16} className="flex-shrink-0" />}
                            <span className="font-medium text-sm dark:text-slate-200 truncate">{title}</span>
                        </div>
                        {onDelete && (
                            <div onClick={(e) => e.stopPropagation()} className="flex-shrink-0 ml-2">
                                <DeleteButton onDelete={onDelete} label={<IconWrapper name="trash-2" size={14}/>} />
                            </div>
                        )}
                    </div>
                    {isOpen && (
                        <div className="p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
                            {children}
                        </div>
                    )}
                </div>
            );
        };

        const StyleActionsEditor = ({ actions, onChange }) => (
            <div className="space-y-2 mt-2">
                <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Style Actions</label>
                {actions.map((action, idx) => (
                    <div key={idx} className="flex gap-2 items-end bg-slate-50 dark:bg-slate-900/50 p-2 rounded">
                        <Combobox 
                            label={idx === 0 ? "Type" : ""} 
                            value={action.styleType} 
                            options={STYLE_TYPES} 
                            onChange={(v) => {
                                const newActions = [...actions];
                                newActions[idx] = { ...newActions[idx], styleType: v };
                                onChange(newActions);
                            }} 
                            className="flex-1"
                            placeholder="Select..."
                        />
                        <Input 
                            label={idx === 0 ? "Preset / Option" : ""}
                            value={action.preset} 
                            onChange={(v) => {
                                const newActions = [...actions];
                                newActions[idx] = { ...newActions[idx], preset: v };
                                onChange(newActions);
                            }} 
                            className="flex-1"
                            placeholder="(Optional)"
                        />
                        <Button 
                            variant="ghost" 
                            size="icon" 
                            onClick={() => {
                                const newActions = actions.filter((_, i) => i !== idx);
                                onChange(newActions);
                            }}
                            className="mb-[1px]"
                        >
                            <IconWrapper name="trash-2" size={16} />
                        </Button>
                    </div>
                ))}
                <Button 
                    variant="secondary" 
                    size="sm" 
                    className="w-full"
                    onClick={() => onChange([...actions, { styleType: "BOLD", preset: "" }])}
                >
                    <IconWrapper name="plus" size={14} className="mr-1" /> Add Style Action
                </Button>
            </div>
        );

        const MentionActionsEditor = ({ actions, onChange }) => (
            <div className="space-y-2 mt-2">
                <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Mention Actions</label>
                {actions.map((action, idx) => (
                    <div key={idx} className="flex gap-2 items-end bg-slate-50 dark:bg-slate-900/50 p-2 rounded">
                        <Combobox 
                            label={idx === 0 ? "Type" : ""}
                            value={action.mentionType} 
                            options={MENTION_TYPES} 
                            onChange={(v) => {
                                const newActions = [...actions];
                                newActions[idx] = { ...newActions[idx], mentionType: v };
                                onChange(newActions);
                            }} 
                            className="flex-1"
                            placeholder="Select..."
                        />
                        <Input 
                            label={idx === 0 ? "Preset" : ""}
                            value={action.preset} 
                            onChange={(v) => {
                                const newActions = [...actions];
                                newActions[idx] = { ...newActions[idx], preset: v };
                                onChange(newActions);
                            }} 
                            className="flex-1"
                            placeholder="e.g. 64 or team_name"
                        />
                        <Button 
                            variant="ghost" 
                            size="icon" 
                            onClick={() => {
                                const newActions = actions.filter((_, i) => i !== idx);
                                onChange(newActions);
                            }}
                            className="mb-[1px]"
                        >
                            <IconWrapper name="trash-2" size={16} />
                        </Button>
                    </div>
                ))}
                <Button 
                    variant="secondary" 
                    size="sm" 
                    className="w-full"
                    onClick={() => onChange([...actions, { mentionType: "PLAYER", preset: "" }])}
                >
                    <IconWrapper name="plus" size={14} className="mr-1" /> Add Mention Action
                </Button>
            </div>
        );

        // --- View Components ---

        const GlobalView = ({ config, updateGlobal, addPreset, removePreset, updatePreset }) => (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <Card className="p-6 space-y-4">
                    <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center">
                        <IconWrapper name="settings" className="mr-2" size={20} /> General
                    </h3>
                    <Input 
                        label="Mod Version (Reference)" 
                        value={config.version} 
                        onChange={(v) => updateGlobal('version', v)} 
                    />
                    <Input 
                        label="Option Delimiter" 
                        value={config.delimiter} 
                        onChange={(v) => updateGlobal('delimiter', v)} 
                        placeholder=","
                    />
                    <Input 
                        label="Timestamp Format" 
                        value={config.timestamp} 
                        onChange={(v) => updateGlobal('timestamp', v)} 
                        placeholder="yyyy-MM-dd HH:mm:ss"
                    />
                    <div className="flex items-center space-x-3 pt-4">
                        <input 
                            type="checkbox" 
                            id="notifEnable"
                            checked={config.notificationCommandEnable}
                            onChange={(e) => updateGlobal('notificationCommandEnable', e.target.checked)}
                            className="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        />
                        <label htmlFor="notifEnable" className="text-sm font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
                            Allow /ec notification command
                        </label>
                    </div>
                </Card>

                <Card className="p-6 space-y-4">
                    <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center">
                        <IconWrapper name="palette" className="mr-2" size={20} /> Colors
                    </h3>
                    <ColorPicker 
                        label="URL Color" 
                        value={config.urlColor} 
                        onChange={(v) => updateGlobal('urlColor', v)} 
                    />
                    <ColorPicker 
                        label="Default Team Color" 
                        value={config.defaultTeamColor} 
                        onChange={(v) => updateGlobal('defaultTeamColor', v)} 
                    />
                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-2">
                        * "Default Team Color" replaces the old "Mention Color" setting.
                    </div>
                </Card>

                <Card className="p-6 col-span-1 md:col-span-2">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-4">
                        <h3 className="text-lg font-bold text-slate-800 dark:text-white">Color Presets</h3>
                        <AddGroupInput 
                            onAdd={addPreset} 
                            placeholder="New Preset Name" 
                        />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        {Object.entries(config.colorPreset).map(([name, color]) => (
                            <div key={name} className="flex items-center space-x-2 bg-slate-50 dark:bg-slate-900/50 p-2 rounded border border-slate-200 dark:border-slate-700">
                                <input 
                                    type="color" 
                                    value={color} 
                                    onChange={(e) => updatePreset(name, e.target.value)}
                                    className="h-8 w-8 rounded border-none bg-transparent cursor-pointer"
                                />
                                <div className="flex-1">
                                    <div className="text-xs font-semibold dark:text-slate-300">{name}</div>
                                    <div className="text-xs text-slate-500 font-mono">{color}</div>
                                </div>
                                <button type="button" onClick={() => removePreset(name)} className="text-slate-400 hover:text-red-500 p-1">
                                    <IconWrapper name="trash-2" size={16} />
                                </button>
                            </div>
                        ))}
                    </div>
                </Card>
            </div>
        );

        const StylingView = ({ config, addPermissionGroup, removePermissionGroup, updateRuleList }) => (
            <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                    <h2 className="text-xl font-bold dark:text-white">Styling Rules</h2>
                    <AddGroupInput 
                        onAdd={(name) => addPermissionGroup('stylingRules', name)} 
                        placeholder="Permission Node (e.g. embellish-chat.vip)" 
                    />
                </div>

                {Object.entries(config.stylingRules).map(([permKey, rules]) => (
                    <Card key={permKey} className="p-4">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
                            <h3 className="font-mono text-sm font-bold text-indigo-600 dark:text-indigo-400 break-all">{permKey}</h3>
                            <DeleteButton 
                                onDelete={() => removePermissionGroup('stylingRules', permKey)} 
                                label="Delete Group"
                            />
                        </div>

                        <div className="space-y-4">
                            {rules.map((rule, idx) => (
                                <Accordion 
                                    key={idx} 
                                    title={`Rule #${idx + 1}: ${rule.pattern || '(Empty Pattern)'}`}
                                    onDelete={() => {
                                        const newRules = rules.filter((_, i) => i !== idx);
                                        updateRuleList('stylingRules', permKey, newRules);
                                    }}
                                >
                                    <div className="space-y-4">
                                        <Input 
                                            label="Regex Pattern" 
                                            value={rule.pattern} 
                                            onChange={(v) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], pattern: v };
                                                updateRuleList('stylingRules', permKey, newRules);
                                            }}
                                            className="font-mono text-sm"
                                            placeholder="e.g. \*\*([^\*]+)\*\*()"
                                        />
                                        <StyleActionsEditor 
                                            actions={rule.styles}
                                            onChange={(newActions) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], styles: newActions };
                                                updateRuleList('stylingRules', permKey, newRules);
                                            }}
                                        />
                                    </div>
                                </Accordion>
                            ))}
                            <Button 
                                className="w-full mt-4" 
                                variant="secondary"
                                onClick={() => {
                                    const newRules = [...rules, { pattern: "", styles: [] }];
                                    updateRuleList('stylingRules', permKey, newRules);
                                }}
                            >
                                <IconWrapper name="plus" size={16} className="mr-2" /> Add Rule to {permKey}
                            </Button>
                        </div>
                    </Card>
                ))}
            </div>
        );

        const MentionView = ({ config, addPermissionGroup, removePermissionGroup, updateRuleList }) => (
            <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                    <h2 className="text-xl font-bold dark:text-white">Mention Rules</h2>
                    <AddGroupInput 
                        onAdd={(name) => addPermissionGroup('mentionRules', name)} 
                        placeholder="Permission Node (e.g. embellish-chat.vip)" 
                    />
                </div>

                {Object.entries(config.mentionRules).map(([permKey, rules]) => (
                    <Card key={permKey} className="p-4">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
                            <h3 className="font-mono text-sm font-bold text-indigo-600 dark:text-indigo-400 break-all">{permKey}</h3>
                            <DeleteButton 
                                onDelete={() => removePermissionGroup('mentionRules', permKey)} 
                                label="Delete Group"
                            />
                        </div>

                        <div className="space-y-4">
                            {rules.map((rule, idx) => (
                                <Accordion 
                                    key={idx} 
                                    title={`Rule #${idx + 1}: ${rule.pattern || '(Empty Pattern)'}`}
                                    onDelete={() => {
                                        const newRules = rules.filter((_, i) => i !== idx);
                                        updateRuleList('mentionRules', permKey, newRules);
                                    }}
                                >
                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                        <Input 
                                            label="Regex Pattern" 
                                            value={rule.pattern} 
                                            onChange={(v) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], pattern: v };
                                                updateRuleList('mentionRules', permKey, newRules);
                                            }}
                                            className="md:col-span-12 font-mono"
                                            placeholder="e.g. @everyone()"
                                        />
                                        <Input 
                                            label="Sound ID" 
                                            value={rule.sound} 
                                            onChange={(v) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], sound: v };
                                                updateRuleList('mentionRules', permKey, newRules);
                                            }}
                                            className="md:col-span-6"
                                        />
                                        <Input 
                                            label="Pitch" 
                                            type="number"
                                            step="0.1"
                                            value={rule.pitch} 
                                            onChange={(v) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], pitch: parseFloat(v) };
                                                updateRuleList('mentionRules', permKey, newRules);
                                            }}
                                            className="md:col-span-3"
                                        />
                                        <div className="md:col-span-3">
                                            <Input 
                                                label="Cooldown (sec)" 
                                                type="number"
                                                step="1"
                                                value={rule.cooldown !== undefined ? rule.cooldown : 0} 
                                                onChange={(v) => {
                                                    const newRules = [...rules];
                                                    newRules[idx] = { ...newRules[idx], cooldown: parseInt(v) || 0 };
                                                    updateRuleList('mentionRules', permKey, newRules);
                                                }}
                                            />
                                        </div>
                                        
                                        <Input 
                                            label="Title (Placeholder API Supported)" 
                                            value={rule.title} 
                                            onChange={(v) => {
                                                const newRules = [...rules];
                                                newRules[idx] = { ...newRules[idx], title: v };
                                                updateRuleList('mentionRules', permKey, newRules);
                                            }}
                                            className="md:col-span-12"
                                        />
                                        
                                        <div className="md:col-span-12 bg-slate-50 dark:bg-slate-900/30 p-3 rounded">
                                            <MentionActionsEditor 
                                                actions={rule.mentions}
                                                onChange={(newActions) => {
                                                    const newRules = [...rules];
                                                    newRules[idx] = { ...newRules[idx], mentions: newActions };
                                                    updateRuleList('mentionRules', permKey, newRules);
                                                }}
                                            />
                                        </div>

                                        <div className="md:col-span-12 bg-slate-50 dark:bg-slate-900/30 p-3 rounded">
                                            <StyleActionsEditor 
                                                actions={rule.styles}
                                                onChange={(newActions) => {
                                                    const newRules = [...rules];
                                                    newRules[idx] = { ...newRules[idx], styles: newActions };
                                                    updateRuleList('mentionRules', permKey, newRules);
                                                }}
                                            />
                                        </div>
                                    </div>
                                </Accordion>
                            ))}
                            <Button 
                                className="w-full mt-4" 
                                variant="secondary"
                                onClick={() => {
                                    const newRules = [...rules, { 
                                        pattern: "", 
                                        sound: "minecraft:entity.experience_orb.pickup", 
                                        pitch: 1.0, 
                                        title: "", 
                                        cooldown: 0, 
                                        mentions: [], 
                                        styles: [] 
                                    }];
                                    updateRuleList('mentionRules', permKey, newRules);
                                }}
                            >
                                <IconWrapper name="plus" size={16} className="mr-2" /> Add Mention Rule
                            </Button>
                        </div>
                    </Card>
                ))}
            </div>
        );

        const JsonView = ({ jsonInput, setJsonInput, handleImport, copyToClipboard, copySuccess, error, onReset }) => (
            <div className="flex flex-col">
                <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-bold dark:text-white">Raw JSON</h2>
                    <div className="space-x-2 flex">
                        <DeleteButton 
                            onDelete={onReset} 
                            label={<><IconWrapper name="rotate-ccw" size={14} className="mr-1 inline" /> Reset Default</>} 
                            size="md"
                        />
                        <Button onClick={handleImport} variant="secondary">
                            <IconWrapper name="upload" size={16} className="mr-2" /> Load from Text
                        </Button>
                        <Button onClick={copyToClipboard} variant="primary">
                            {copySuccess ? <IconWrapper name="check" size={16} className="mr-2" /> : <IconWrapper name="copy" size={16} className="mr-2" />}
                            {copySuccess ? "Copied!" : "Copy to Clipboard"}
                        </Button>
                    </div>
                </div>
                {error && <div className="bg-red-100 text-red-700 p-3 rounded mb-4">{error}</div>}
                <textarea
                    className="w-full min-h-[600px] font-mono text-sm p-4 bg-slate-900 text-slate-100 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    value={jsonInput}
                    onChange={(e) => setJsonInput(e.target.value)}
                    spellCheck="false"
                />
            </div>
        );

        // --- Main Application ---

        function ConfigEditor() {
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [activeTab, setActiveTab] = useState("global");
            const [jsonInput, setJsonInput] = useState("");
            const [copySuccess, setCopySuccess] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                setJsonInput(JSON.stringify(config, null, 2));
            }, []);

            useEffect(() => {
                setJsonInput(JSON.stringify(config, null, 2));
            }, [config]);

            const handleImport = () => {
                try {
                    const parsed = JSON.parse(jsonInput);
                    
                    if (parsed.mentionColor && !parsed.defaultTeamColor) {
                        parsed.defaultTeamColor = parsed.mentionColor;
                        delete parsed.mentionColor;
                    }
                    
                    if (parsed.bannedPlayerList === undefined) parsed.bannedPlayerList = [];
                    if (parsed.notificationOffPlayerList === undefined) parsed.notificationOffPlayerList = [];
                    
                    if (parsed.mentionRules) {
                        Object.keys(parsed.mentionRules).forEach(key => {
                            parsed.mentionRules[key].forEach(rule => {
                                if (rule.cooldown === undefined) rule.cooldown = 0;
                            });
                        });
                    }

                    setConfig(parsed);
                    setError(null);
                    alert("Configuration loaded successfully!");
                } catch (e) {
                    setError("Invalid JSON: " + e.message);
                }
            };

            const handleReset = () => {
                setConfig(DEFAULT_CONFIG);
                alert("Configuration reset to defaults.");
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(JSON.stringify(config, null, 2));
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 2000);
            };

            const updateGlobal = (key, val) => setConfig(prev => ({ ...prev, [key]: val }));
            
            const addPreset = (name) => {
                if (!name) return;
                if (config.colorPreset[name]) {
                    alert("Preset already exists!");
                    return;
                }
                setConfig(prev => ({
                    ...prev,
                    colorPreset: { ...prev.colorPreset, [name]: "#FFFFFF" }
                }));
            };

            const removePreset = (key) => {
                const newPresets = { ...config.colorPreset };
                delete newPresets[key];
                updateGlobal('colorPreset', newPresets);
            };

            const updatePreset = (key, val) => {
                setConfig(prev => ({
                    ...prev,
                    colorPreset: { ...prev.colorPreset, [key]: val }
                }));
            };

            const updateRuleList = (category, permissionKey, newRules) => {
                setConfig(prev => ({
                    ...prev,
                    [category]: {
                        ...prev[category],
                        [permissionKey]: newRules
                    }
                }));
            };

            const addPermissionGroup = (category, key) => {
                if (!key) return;
                
                if (config[category][key]) {
                    alert("This permission group already exists!");
                    return;
                }

                setConfig(prev => ({
                    ...prev,
                    [category]: { ...prev[category], [key]: [] }
                }));
            };

            const removePermissionGroup = (category, key) => {
                setConfig(prev => {
                    const newCat = { ...prev[category] };
                    delete newCat[key];
                    return { ...prev, [category]: newCat };
                });
            };

            const tabs = [
                { id: "global", label: "Global Settings", icon: "settings" },
                { id: "styling", label: "Styling Rules", icon: "message-square" },
                { id: "mention", label: "Mention Rules", icon: "at-sign" },
                { id: "json", label: "Import / Export", icon: "file-json" },
            ];

            // Re-run lucide icons after render
            useEffect(() => {
                lucide.createIcons();
            });

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">
                    <div className="max-w-6xl mx-auto px-4 py-8">
                        
                        <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600">
                                    Embellish Chat
                                </h1>
                                <p className="text-slate-500 dark:text-slate-400 mt-1">Config Editor v2.5.0</p>
                            </div>
                            <div className="flex gap-2 bg-white dark:bg-slate-900 p-1 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800 overflow-x-auto">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center px-4 py-2 rounded-md text-sm font-medium transition-all whitespace-nowrap ${
                                            activeTab === tab.id 
                                                ? "bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300" 
                                                : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                                        }`}
                                    >
                                        <IconWrapper name={tab.icon} size={16} className="mr-2" />
                                        <span className="hidden sm:inline">{tab.label}</span>
                                        <span className="sm:hidden">{tab.label.split(' ')[0]}</span>
                                    </button>
                                ))}
                            </div>
                        </header>

                        <main className="space-y-6 pb-20">
                            {activeTab === 'global' && (
                                <GlobalView 
                                    config={config} 
                                    updateGlobal={updateGlobal} 
                                    addPreset={addPreset} 
                                    removePreset={removePreset} 
                                    updatePreset={updatePreset} 
                                />
                            )}
                            {activeTab === 'styling' && (
                                <StylingView 
                                    config={config} 
                                    addPermissionGroup={addPermissionGroup} 
                                    removePermissionGroup={removePermissionGroup} 
                                    updateRuleList={updateRuleList} 
                                />
                            )}
                            {activeTab === 'mention' && (
                                <MentionView 
                                    config={config} 
                                    addPermissionGroup={addPermissionGroup} 
                                    removePermissionGroup={removePermissionGroup} 
                                    updateRuleList={updateRuleList} 
                                />
                            )}
                            {activeTab === 'json' && (
                                <JsonView 
                                    jsonInput={jsonInput} 
                                    setJsonInput={setJsonInput} 
                                    handleImport={handleImport} 
                                    copyToClipboard={copyToClipboard} 
                                    copySuccess={copySuccess} 
                                    error={error} 
                                    onReset={handleReset}
                                />
                            )}
                        </main>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ConfigEditor />);
    </script>
</body>
</html>
