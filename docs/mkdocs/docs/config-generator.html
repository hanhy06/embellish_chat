<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embellish Chat Config Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const IconWrapper = ({ name, size, className }) => {
        const iconKey = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');

        if (!window.lucide || !window.lucide.icons || !window.lucide.icons[iconKey]) {
            return <span style={{ width: size, height: size, display: 'inline-block' }} />;
        }

        try {
            if (typeof window.lucide.createElement === 'function') {
                const element = window.lucide.createElement(window.lucide.icons[iconKey]);
                element.setAttribute('width', size);
                element.setAttribute('height', size);
                if (className) element.setAttribute('class', className);
                element.setAttribute('stroke-width', '2');
                return <span dangerouslySetInnerHTML={{ __html: element.outerHTML }} style={{ display: 'inline-flex', verticalAlign: 'middle' }} />;
            }
        } catch (e) {
            console.error(e);
        }

        return null;
    };

    const STYLE_TYPES = [
        "<COLORS>","COLOR_HEX","COLOR_RAINBOW","COLOR_GRADIENT","COLOR_PRESET","COLOR_SHADOW","COLOR_TEAM",
        "<Formatting>","BOLD","ITALIC","UNDERLINE","STRIKETHROUGH","OBFUSCATED","FONT","CLEAR",
        "<Interaction>","CLICK_COMMAND_RUN","CLICK_COMMAND_SUGGEST","CLICK_COPY","HOVER_TEXT","HOVER_ITEM","URL","METADATA",
        "<Modification>","UPPER","LOWER","CAPITALIZE","REPLACE","MASK","PREFIX","SUFFIX",
        "<Advanced>","SHOW_ITEM","SHOW_INVENTORY","JSON","DISCORD_JSON","COMMAND_RUN","LOG","BUBBLE", "BLOCK","ATLAS_PRESET"
    ];

    const MENTION_TYPES = [
        "PLAYER", "TEAM", "INSIDE", "EVERYONE", "LUCK_PERMS_GROUP", "WORLD","CUSTOM"
    ];

    const SOUND_CATEGORIES = [
        "MASTER", "MUSIC", "RECORDS", "WEATHER", "BLOCKS", "HOSTILE", "NEUTRAL", "PLAYERS", "AMBIENT", "VOICE", "UI"
    ];

    // Default config.json
    const DEFAULT_CONFIG = {
      "version": "3.1.0",
      "colorPreset": {
        "dark green": "#00AA00",
        "green": "#55FF55",
        "yellow": "#FFFF55",
        "black": "#000000",
        "dark red": "#AA0000",
        "dark purple": "#AA00AA",
        "light purple": "#FF55FF",
        "dark gray": "#555555",
        "red": "#FF5555",
        "gold": "#FFAA00",
        "aqua": "#55FFFF",
        "gray": "#AAAAAA",
        "white": "#FFFFFF",
        "blue": "#5555FF",
        "dark aqua": "#00AAAA",
        "dark blue": "#0000AA"
      },
      "atlasPreset": {
        "fire": { "atlas": "minecraft:blocks", "sprite": "minecraft:block/campfire_fire" },
        "hunger": { "atlas": "minecraft:gui", "sprite": "minecraft:hud/food_full" },
        "heart": { "atlas": "minecraft:gui", "sprite": "minecraft:hud/heart/full" },
        "yes": { "atlas": "minecraft:gui", "sprite": "minecraft:container/beacon/confirm" },
        "no": { "atlas": "minecraft:gui", "sprite": "minecraft:container/beacon/cancel" },
        "move": { "atlas": "minecraft:gui", "sprite": "minecraft:mob_effect/wind_charged" }
      },
      "delimiter": ",",
      "timestamp": "yyyy-MM-dd HH:mm:ss",
      "urlColor": "#0000EE",
      "defaultTeamColor": "#FF55FF",
      "notificationCommandEnable": true,
      "mentionBroadcast": true,
      "useClearFormat": false,
      "bannedPlayerList": [],
      "notificationOffPlayerList": [],
      "webhook": ""
    };

    // Default styles.json
    const DEFAULT_STYLES = {
      "stylingRules": {
        "embellish-chat.chat": [
          { "pattern": "\\[([^\\]]+?)]\\((https://.*?)\\)", "styles": [{ "styleType": "URL", "preset": "" }] },
          { "pattern": "((https://\\S+))", "styles": [{ "styleType": "URL", "preset": "" }] },
          { "pattern": "\\[([^\\]]+?)]\\{(.*?)}", "styles": [{ "styleType": "FONT", "preset": "" }] },
          { "pattern": "\\[([^\\]]+?)]<(#.{6})>", "styles": [{ "styleType": "COLOR_HEX", "preset": "" }] },
          { "pattern": "\\[([^\\]]+?)]<(#.{6,})>", "styles": [{ "styleType": "COLOR_GRADIENT", "preset": "" }] },
          { "pattern": "\\[([^\\]]+?)]<([a-z\\s]+?)>", "styles": [{ "styleType": "COLOR_PRESET", "preset": "" }] },
          { "pattern": "\\*\\*(.+?)\\*\\*()", "styles": [{ "styleType": "BOLD", "preset": "" }] },
          { "pattern": "__(.+?)__()", "styles": [{ "styleType": "UNDERLINE", "preset": "" }] },
          { "pattern": "_(.+?)_()", "styles": [{ "styleType": "ITALIC", "preset": "" }] },
          { "pattern": "~~(.+?)~~()", "styles": [{ "styleType": "STRIKETHROUGH", "preset": "" }] },
          { "pattern": "\\|\\|(.+?)\\|\\|()", "styles": [{ "styleType": "OBFUSCATED", "preset": "" }] },
          { "pattern": "\\[([^\\]]+?)]<(RAINBOW)>", "styles": [{ "styleType": "COLOR_RAINBOW", "preset": "0.7" }] },
          { "pattern": "(.+)()", "styles": [{ "styleType": "METADATA", "preset": "" }] },
          { "pattern": "(\\[i\\])()", "styles": [{ "styleType": "SHOW_ITEM", "preset": "" }] },
          { "pattern": "(\\[inv\\])()", "styles": [{ "styleType": "SHOW_INVENTORY", "preset": "" }] },
          { "pattern": "(:(.+?):)", "styles": [{ "styleType": "ATLAS_PRESET", "preset": "" }] }
        ],
        "embellish-chat.command_argument": []
      }
    };

    // Default mentions.json
    const DEFAULT_MENTIONS = {
      "mentionRules": {
        "embellish-chat.mention": [
          {
            "pattern": "@here()",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "INSIDE", "preset": "64" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }, { "styleType": "COLOR_PRESET", "preset": "light purple" }]
          },
          {
            "pattern": "@everyone()",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "EVERYONE", "preset": "" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }, { "styleType": "COLOR_PRESET", "preset": "light purple" }]
          },
          {
            "pattern": "@team\\((.+?)\\)",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "TEAM", "preset": "" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }]
          },
          {
            "pattern": "@group\\((.+?)\\)",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "LUCK_PERMS_GROUP", "preset": "" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }, { "styleType": "COLOR_PRESET", "preset": "light purple" }]
          },
          {
            "pattern": "@world\\((.+?)\\)",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "WORLD", "preset": "" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }, { "styleType": "COLOR_PRESET", "preset": "light purple" }]
          },
          {
            "pattern": "@([A-Za-z0-9_]{1,16})(?=\\b|\\s|$)",
            "title": "%player:displayname% mentioned you",
            "cooldown": 0,
            "onlyTarget": false,
            "sound": { "id": "minecraft:entity.experience_orb.pickup", "category": "UI", "volume": 1.0, "pitch": 1.75 },
            "mentions": [{ "mentionType": "PLAYER", "preset": "" }],
            "styles": [{ "styleType": "BOLD", "preset": "" }]
          }
        ]
      }
    };



    const Card = ({ children, className = "" }) => (
        <div className={`bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 ${className}`}>
            {children}
        </div>
    );

    const Button = ({ onClick, children, variant = "primary", size = "md", className = "", disabled = false }) => {
        const baseStyles = "flex items-center justify-center font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1";
        const variants = {
            primary: "bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500",
            secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200 focus:ring-slate-500",
            danger: "bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-900/30 dark:hover:bg-red-900/50 dark:text-red-400 focus:ring-red-500",
            ghost: "bg-transparent hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200",
        };
        const sizes = {
            sm: "px-2 py-1 text-xs",
            md: "px-4 py-2 text-sm",
            icon: "p-2",
        };

        return (
            <button
                type="button"
                onClick={onClick}
                className={`${baseStyles} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
                disabled={disabled}
            >
                {children}
            </button>
        );
    };

    const DeleteButton = ({ onDelete, label = "Delete", size = "sm", className = "" }) => {
        const [isConfirming, setIsConfirming] = useState(false);

        useEffect(() => {
            let timeout;
            if (isConfirming) {
                timeout = setTimeout(() => setIsConfirming(false), 3000);
            }
            return () => clearTimeout(timeout);
        }, [isConfirming]);

        return (
            <Button
                variant="danger"
                size={size}
                className={className}
                onClick={(e) => {
                    e.stopPropagation();
                    if (isConfirming) {
                        onDelete();
                        setIsConfirming(false);
                    } else {
                        setIsConfirming(true);
                    }
                }}
            >
                {isConfirming ? "Confirm?" : label}
            </Button>
        );
    };

    const AddGroupInput = ({ onAdd, placeholder }) => {
        const [value, setValue] = useState("");

        const handleAdd = () => {
            if (value.trim()) {
                onAdd(value.trim());
                setValue("");
            }
        };

        return (
            <div className="flex items-center space-x-2">
                <input
                    type="text"
                    value={value}
                    onChange={(e) => setValue(e.target.value)}
                    placeholder={placeholder}
                    className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 dark:text-white flex-1 md:flex-none md:w-64"
                    onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
                />
                <Button size="sm" onClick={handleAdd} disabled={!value.trim()}>
                    <IconWrapper name="plus" size={16} className="mr-1" /> Add
                </Button>
            </div>
        );
    };

    const Input = ({ label, value, onChange, placeholder, type = "text", className = "", step = "any" }) => (
        <div className={`flex flex-col space-y-1 ${className}`}>
            {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
            <input
                type={type}
                step={step}
                value={value || ""}
                onChange={(e) => onChange(e.target.value)}
                placeholder={placeholder}
                className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:text-white"
            />
        </div>
    );

    const Combobox = ({ label, value, onChange, options, className = "", placeholder = "" }) => {
        const [listId] = useState(() => "datalist-" + Math.random().toString(36).substr(2, 9));

        return (
            <div className={`flex flex-col space-y-1 ${className}`}>
                {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
                <input
                    list={listId}
                    value={value || ""}
                    onChange={(e) => onChange(e.target.value)}
                    className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:text-white"
                    placeholder={placeholder}
                />
                <datalist id={listId}>
                    {options.map((opt) => (
                        <option key={opt} value={opt} />
                    ))}
                </datalist>
            </div>
        );
    };

    const ColorPicker = ({ label, value, onChange }) => (
        <div className="flex flex-col space-y-1">
            {label && <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">{label}</label>}
            <div className="flex items-center space-x-2">
                <input
                    type="color"
                    value={value || "#000000"}
                    onChange={(e) => onChange(e.target.value)}
                    className="h-9 w-9 p-0.5 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 cursor-pointer"
                />
                <input
                    type="text"
                    value={value || ""}
                    onChange={(e) => onChange(e.target.value)}
                    className="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-md text-sm font-mono dark:text-white"
                    placeholder="#RRGGBB"
                />
            </div>
        </div>
    );

    const Accordion = ({ title, children, defaultOpen = false, onDelete }) => {
        const [isOpen, setIsOpen] = useState(defaultOpen);
        return (
            <div className="border border-slate-200 dark:border-slate-700 rounded-lg mb-2 overflow-hidden">
                <div
                    className="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-800/50 cursor-pointer select-none"
                    onClick={() => setIsOpen(!isOpen)}
                >
                    <div className="flex items-center space-x-2 overflow-hidden">
                        {isOpen ? <IconWrapper name="chevron-down" size={16} className="flex-shrink-0" /> : <IconWrapper name="chevron-right" size={16} className="flex-shrink-0" />}
                        <span className="font-medium text-sm dark:text-slate-200 truncate">{title}</span>
                    </div>
                    {onDelete && (
                        <div onClick={(e) => e.stopPropagation()} className="flex-shrink-0 ml-2">
                            <DeleteButton onDelete={onDelete} label={<IconWrapper name="trash-2" size={14}/>} />
                        </div>
                    )}
                </div>
                {isOpen && (
                    <div className="p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
                        {children}
                    </div>
                )}
            </div>
        );
    };

    const StyleActionsEditor = ({ actions, onChange }) => (
        <div className="space-y-2 mt-2">
            <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Style Actions</label>
            {actions.map((action, idx) => (
                <div key={idx} className="flex gap-2 items-end bg-slate-50 dark:bg-slate-900/50 p-2 rounded">
                    <Combobox
                        label={idx === 0 ? "Type" : ""}
                        value={action.styleType}
                        options={STYLE_TYPES}
                        onChange={(v) => {
                            const newActions = [...actions];
                            newActions[idx] = { ...newActions[idx], styleType: v };
                            onChange(newActions);
                        }}
                        className="flex-1"
                        placeholder="Select..."
                    />
                    <Input
                        label={idx === 0 ? "Preset / Option" : ""}
                        value={action.preset}
                        onChange={(v) => {
                            const newActions = [...actions];
                            newActions[idx] = { ...newActions[idx], preset: v };
                            onChange(newActions);
                        }}
                        className="flex-1"
                        placeholder="(Optional)"
                    />
                    <Button
                        variant="ghost"
                        size="icon"
                        onClick={() => {
                            const newActions = actions.filter((_, i) => i !== idx);
                            onChange(newActions);
                        }}
                        className="mb-[1px]"
                    >
                        <IconWrapper name="trash-2" size={16} />
                    </Button>
                </div>
            ))}
            <Button
                variant="secondary"
                size="sm"
                className="w-full"
                onClick={() => onChange([...actions, { styleType: "", preset: "" }])}
            >
                <IconWrapper name="plus" size={14} className="mr-1" /> Add Style Action
            </Button>
        </div>
    );

    const MentionActionsEditor = ({ actions, onChange }) => (
        <div className="space-y-2 mt-2">
            <label className="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Mention Actions</label>
            {actions.map((action, idx) => (
                <div key={idx} className="flex gap-2 items-end bg-slate-50 dark:bg-slate-900/50 p-2 rounded">
                    <Combobox
                        label={idx === 0 ? "Type" : ""}
                        value={action.mentionType}
                        options={MENTION_TYPES}
                        onChange={(v) => {
                            const newActions = [...actions];
                            newActions[idx] = { ...newActions[idx], mentionType: v };
                            onChange(newActions);
                        }}
                        className="flex-1"
                        placeholder="Select..."
                    />
                    <Input
                        label={idx === 0 ? "Preset" : ""}
                        value={action.preset}
                        onChange={(v) => {
                            const newActions = [...actions];
                            newActions[idx] = { ...newActions[idx], preset: v };
                            onChange(newActions);
                        }}
                        className="flex-1"
                        placeholder="e.g. 64 or team_name"
                    />
                    <Button
                        variant="ghost"
                        size="icon"
                        onClick={() => {
                            const newActions = actions.filter((_, i) => i !== idx);
                            onChange(newActions);
                        }}
                        className="mb-[1px]"
                    >
                        <IconWrapper name="trash-2" size={16} />
                    </Button>
                </div>
            ))}
            <Button
                variant="secondary"
                size="sm"
                className="w-full"
                onClick={() => onChange([...actions, { mentionType: "", preset: "" }])}
            >
                <IconWrapper name="plus" size={14} className="mr-1" /> Add Mention Action
            </Button>
        </div>
    );

    const GlobalView = ({ config, updateGlobal, addPreset, removePreset, updatePreset, addAtlasPreset, removeAtlasPreset, updateAtlasPreset }) => (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <Card className="p-6 space-y-4">
                <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center">
                    <IconWrapper name="settings" className="mr-2" size={20} /> General
                </h3>
                <Input
                    label="Mod Version (Reference)"
                    value={config.version}
                    onChange={(v) => updateGlobal('version', v)}
                />
                <Input
                    label="Option Delimiter"
                    value={config.delimiter}
                    onChange={(v) => updateGlobal('delimiter', v)}
                    placeholder=","
                />
                <Input
                    label="Timestamp Format"
                    value={config.timestamp}
                    onChange={(v) => updateGlobal('timestamp', v)}
                    placeholder="yyyy-MM-dd HH:mm:ss"
                />
                <div className="flex flex-col gap-3">
                    <div className="flex items-center space-x-3 pt-2">
                        <input
                            type="checkbox"
                            id="notifEnable"
                            checked={config.notificationCommandEnable}
                            onChange={(e) => updateGlobal('notificationCommandEnable', e.target.checked)}
                            className="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        />
                        <label htmlFor="notifEnable" className="text-sm font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
                            Allow /ec notification command
                        </label>
                    </div>

                    <div className="flex items-center space-x-3">
                        <input
                            type="checkbox"
                            id="mentionBroadcast"
                            checked={config.mentionBroadcast}
                            onChange={(e) => updateGlobal('mentionBroadcast', e.target.checked)}
                            className="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        />
                        <label htmlFor="mentionBroadcast" className="text-sm font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
                            Broadcast Mentions globally
                        </label>
                    </div>

                    <div className="flex items-center space-x-3">
                        <input
                            type="checkbox"
                            id="useClearFormat"
                            checked={config.useClearFormat}
                            onChange={(e) => updateGlobal('useClearFormat', e.target.checked)}
                            className="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        />
                        <label htmlFor="useClearFormat" className="text-sm font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
                            Use Clear Format (Remove default &lt;name&gt; prefix)
                        </label>
                    </div>
                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-700">
                    <Input
                        label="Discord Webhook URL"
                        value={config.webhook}
                        onChange={(v) => updateGlobal('webhook', v)}
                        placeholder="Leave empty to disable"
                    />
                </div>
            </Card>

            <Card className="p-6 space-y-4">
                <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center">
                    <IconWrapper name="palette" className="mr-2" size={20} /> Colors
                </h3>
                <ColorPicker
                    label="URL Color"
                    value={config.urlColor}
                    onChange={(v) => updateGlobal('urlColor', v)}
                />
                <ColorPicker
                    label="Default Team Color"
                    value={config.defaultTeamColor}
                    onChange={(v) => updateGlobal('defaultTeamColor', v)}
                />
            </Card>

            <Card className="p-6 col-span-1 md:col-span-2">
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-4">
                    <h3 className="text-lg font-bold text-slate-800 dark:text-white">Color Presets</h3>
                    <AddGroupInput
                        onAdd={addPreset}
                        placeholder="New Preset Name"
                    />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {Object.entries(config.colorPreset || {}).map(([name, color]) => (
                        <div key={name} className="flex items-center space-x-2 bg-slate-50 dark:bg-slate-900/50 p-2 rounded border border-slate-200 dark:border-slate-700">
                            <input
                                type="color"
                                value={color}
                                onChange={(e) => updatePreset(name, e.target.value)}
                                className="h-8 w-8 rounded border-none bg-transparent cursor-pointer"
                            />
                            <div className="flex-1">

    const JsonView = ({

    }) => {

            if (activeJsonTab === "config") return configJson;
            if (activeJsonTab === "styles") return stylesJson;
            return mentionsJson;
        };

        const setCurrentJson = (val) => {
            if (activeJsonTab === "config") setConfigJson(val);

    function ConfigEditor() {
        // 3개의 분리된 설정 상태
        const [config, setConfig] = useState(DEFAULT_CONFIG);
        const [styles, setStyles] = useState(DEFAULT_STYLES);
        const [mentions, setMentions] = useState(DEFAULT_MENTIONS);

        const [activeTab, setActiveTab] = useState("global");
        const [activeJsonTab, setActiveJsonTab] = useState("config");

        const [configJson, setConfigJson] = useState("");
        const [stylesJson, setStylesJson] = useState("");
        const [mentionsJson, setMentionsJson] = useState("");

        const [copySuccess, setCopySuccess] = useState(null);
        const [error, setError] = useState(null);

        useEffect(() => {
            setConfigJson(JSON.stringify(config, null, 2));
        }, [config]);

        useEffect(() => {
            setStylesJson(JSON.stringify(styles, null, 2));
        }, [styles]);

        useEffect(() => {
            setMentionsJson(JSON.stringify(mentions, null, 2));
        }, [mentions]);

        const handleImport = (fileType) => {
            try {
                if (fileType === "config") {
                    const parsed = JSON.parse(configJson);
                    // Migration from old format
                    if (parsed.mentionColor && !parsed.defaultTeamColor) {
                        parsed.defaultTeamColor = parsed.mentionColor;
                        delete parsed.mentionColor;
                    }
                    if (parsed.bannedPlayerList === undefined) parsed.bannedPlayerList = [];
                    if (parsed.notificationOffPlayerList === undefined) parsed.notificationOffPlayerList = [];
                    if (parsed.mentionBroadcast === undefined) parsed.mentionBroadcast = true;
                    if (parsed.webhook === undefined) parsed.webhook = "";
                    if (parsed.useClearFormat === undefined) parsed.useClearFormat = false;
                    if (parsed.atlasPreset === undefined) parsed.atlasPreset = {};
                    setConfig(parsed);
                } else if (fileType === "styles") {
                    const parsed = JSON.parse(stylesJson);
                    setStyles(parsed);
                } else if (fileType === "mentions") {
                    const parsed = JSON.parse(mentionsJson);
                    // Migration: add onlyTarget if missing
                    if (parsed.mentionRules) {
                        Object.keys(parsed.mentionRules).forEach(key => {
                            parsed.mentionRules[key].forEach(rule => {
                                if (rule.cooldown === undefined) rule.cooldown = 0;
                                if (rule.onlyTarget === undefined) rule.onlyTarget = false;
                                if (rule.sound && typeof rule.sound === 'string') {
                                    rule.sound = { id: rule.sound, category: "UI", volume: 1.0, pitch: rule.pitch || 1.0 };
                                    delete rule.pitch;
                                }
                            });
                        });
                    }
                    setMentions(parsed);
                }
                setError(null);
                alert(`${fileType}.json loaded successfully!`);
            } catch (e) {
                setError("Invalid JSON: " + e.message);
            }
        };

        const handleReset = () => {
            setConfig(DEFAULT_CONFIG);
            setStyles(DEFAULT_STYLES);
            setMentions(DEFAULT_MENTIONS);
            alert("All configurations reset to defaults.");
        };

        const copyToClipboard = (fileType) => {
            let content;
            if (fileType === "config") content = JSON.stringify(config, null, 2);
            else if (fileType === "styles") content = JSON.stringify(styles, null, 2);
            else content = JSON.stringify(mentions, null, 2);

            navigator.clipboard.writeText(content);
            setCopySuccess(fileType);
            setTimeout(() => setCopySuccess(null), 2000);
        };

        const updateGlobal = (key, val) => setConfig(prev => ({ ...prev, [key]: val }));

        const addPreset = (name) => {
            if (!name) return;
            if (config.colorPreset && config.colorPreset[name]) {
                alert("Preset already exists!");
                return;
            }
            setConfig(prev => ({
                ...prev,
                colorPreset: { ...(prev.colorPreset || {}), [name]: "#FFFFFF" }
            }));
        };

        const removePreset = (key) => {
            const newPresets = { ...config.colorPreset };
            delete newPresets[key];
            updateGlobal('colorPreset', newPresets);
        };

        const updatePreset = (key, val) => {
            setConfig(prev => ({
                ...prev,
                colorPreset: { ...prev.colorPreset, [key]: val }
            }));
        };

        const addAtlasPreset = (name) => {
            if (!name) return;
            if (config.atlasPreset && config.atlasPreset[name]) {
                alert("Atlas preset already exists!");
                return;
            }
            setConfig(prev => ({
                ...prev,
                atlasPreset: { ...(prev.atlasPreset || {}), [name]: { atlas: "minecraft:gui", sprite: "" } }
            }));
        };

        const removeAtlasPreset = (key) => {
            const newPresets = { ...config.atlasPreset };
            delete newPresets[key];
            updateGlobal('atlasPreset', newPresets);
        };

        const updateAtlasPreset = (key, field, val) => {
            setConfig(prev => ({
                ...prev,
                atlasPreset: {
                    ...prev.atlasPreset,
                    [key]: { ...prev.atlasPreset[key], [field]: val }
                }
            }));
        };

        // Styling Rules (styles.json)
        const updateStyleRuleList = (permissionKey, newRules) => {
            setStyles(prev => ({
                ...prev,
                stylingRules: {
                    ...prev.stylingRules,
                    [permissionKey]: newRules
                }
            }));
        };

        const addStylePermissionGroup = (key) => {
            if (!key) return;
            if (styles.stylingRules[key]) {
                alert("This permission group already exists!");
                return;
            }
            setStyles(prev => ({
                ...prev,
                stylingRules: { ...prev.stylingRules, [key]: [] }
            }));
        };

        const removeStylePermissionGroup = (key) => {
            setStyles(prev => {
                const newRules = { ...prev.stylingRules };
                delete newRules[key];
                return { ...prev, stylingRules: newRules };
            });
        };

        // Mention Rules (mentions.json)
        const updateMentionRuleList = (permissionKey, newRules) => {
            setMentions(prev => ({
                ...prev,
                mentionRules: {
                    ...prev.mentionRules,
                    [permissionKey]: newRules
                }
            }));
        };

        const addMentionPermissionGroup = (key) => {
            if (!key) return;
            if (mentions.mentionRules[key]) {
                alert("This permission group already exists!");
                return;
            }
            setMentions(prev => ({
                ...prev,
                mentionRules: { ...prev.mentionRules, [key]: [] }
            }));
        };

        const removeMentionPermissionGroup = (key) => {
            setMentions(prev => {
                const newRules = { ...prev.mentionRules };
                delete newRules[key];
                return { ...prev, mentionRules: newRules };
            });
        };

        // Wrapper functions for compatibility with existing views
        const addPermissionGroup = (category, key) => {
            if (category === 'stylingRules') addStylePermissionGroup(key);
            else if (category === 'mentionRules') addMentionPermissionGroup(key);
        };

        const removePermissionGroup = (category, key) => {
            if (category === 'stylingRules') removeStylePermissionGroup(key);
            else if (category === 'mentionRules') removeMentionPermissionGroup(key);
        };

        const updateRuleList = (category, permissionKey, newRules) => {
            if (category === 'stylingRules') updateStyleRuleList(permissionKey, newRules);
            else if (category === 'mentionRules') updateMentionRuleList(permissionKey, newRules);
        };

        const tabs = [
            { id: "global", label: "Global Settings", icon: "settings" },
            { id: "styling", label: "Styling Rules", icon: "message-square" },
            { id: "mention", label: "Mention Rules", icon: "at-sign" },
            { id: "json", label: "Import / Export", icon: "file-json" },
        ];

        return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">
                <div className="max-w-6xl mx-auto px-4 py-8">

                    <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600">
                                Embellish Chat
                            </h1>
                            <p className="text-slate-500 dark:text-slate-400 mt-1">Config Editor v3.1.0</p>
                        </div>
                        <div className="flex gap-2 bg-white dark:bg-slate-900 p-1 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800 overflow-x-auto">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center px-4 py-2 rounded-md text-sm font-medium transition-all whitespace-nowrap ${
                                        activeTab === tab.id
                                            ? "bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300"
                                            : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                                    }`}
                                >
                                    <IconWrapper name={tab.icon} size={16} className="mr-2" />
                                    <span className="hidden sm:inline">{tab.label}</span>
                                    <span className="sm:hidden">{tab.label.split(' ')[0]}</span>
                                </button>
                            ))}
                        </div>
                    </header>

                    <main className="space-y-6 pb-20">
                        {activeTab === 'global' && (
                            <GlobalView
                                config={config}
                                updateGlobal={updateGlobal}
                                addPreset={addPreset}
                                removePreset={removePreset}
                                updatePreset={updatePreset}
                                addAtlasPreset={addAtlasPreset}
                                removeAtlasPreset={removeAtlasPreset}
                                updateAtlasPreset={updateAtlasPreset}
                            />
                        )}
                        {activeTab === 'styling' && (
                            <StylingView
                                config={styles}
                                addPermissionGroup={(cat, key) => addPermissionGroup('stylingRules', key)}
                                removePermissionGroup={(cat, key) => removePermissionGroup('stylingRules', key)}
                                updateRuleList={(cat, permKey, rules) => updateRuleList('stylingRules', permKey, rules)}
                            />
                        )}
                        {activeTab === 'mention' && (
                            <MentionView
                                config={mentions}
                                addPermissionGroup={(cat, key) => addPermissionGroup('mentionRules', key)}
                                removePermissionGroup={(cat, key) => removePermissionGroup('mentionRules', key)}
                                updateRuleList={(cat, permKey, rules) => updateRuleList('mentionRules', permKey, rules)}
                            />
                        )}
                        {activeTab === 'json' && (
                            <JsonView
                                configJson={configJson}
                                setConfigJson={setConfigJson}
                                stylesJson={stylesJson}
                                setStylesJson={setStylesJson}
                                mentionsJson={mentionsJson}
                                setMentionsJson={setMentionsJson}
                                handleImport={handleImport}
                                copyToClipboard={copyToClipboard}
                                copySuccess={copySuccess}
                                error={error}
                                onReset={handleReset}
                                activeJsonTab={activeJsonTab}
                                setActiveJsonTab={setActiveJsonTab}
                            />
                        )}
                    </main>

                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConfigEditor />);
</script>
</body>
</html>
