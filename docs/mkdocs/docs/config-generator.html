<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embellish Chat Config Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    boxShadow: {
                        glow: '0 20px 60px rgba(79, 70, 229, 0.18)',
                        soft: '0 20px 45px rgba(15, 23, 42, 0.10)'
                    }
                }
            }
        };
    </script>
    <script>
        (() => {
            const storageKey = 'embellish-chat-theme';
            const root = document.documentElement;
            const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

            try {
                const savedTheme = localStorage.getItem(storageKey);
                const resolvedTheme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme;
                root.classList.toggle('dark', resolvedTheme === 'dark');
                root.dataset.theme = resolvedTheme;
            } catch (error) {
                root.classList.toggle('dark', systemTheme === 'dark');
                root.dataset.theme = systemTheme;
            }
        })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CONFIG_VERSION = "3.4.0";

    const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
    const THEME_STORAGE_KEY = "embellish-chat-theme";
    const getSystemTheme = () => (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light");
    const getInitialTheme = () => {
        if (typeof document !== 'undefined' && document.documentElement.dataset.theme) {
            return document.documentElement.dataset.theme;
        }

        try {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            return savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : getSystemTheme();
        } catch (error) {
            return getSystemTheme();
        }
    };
    const applyTheme = (theme) => {
        if (typeof document === 'undefined') return;
        const resolvedTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
        document.documentElement.dataset.theme = resolvedTheme;
    };

    const IconWrapper = ({ name, size, className }) => {
        const iconKey = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');

        if (!window.lucide || !window.lucide.icons || !window.lucide.icons[iconKey]) {
            return <span style={{ width: size, height: size, display: 'inline-block' }} />;
        }

        try {
            if (typeof window.lucide.createElement === 'function') {
                const element = window.lucide.createElement(window.lucide.icons[iconKey]);
                element.setAttribute('width', size);
                element.setAttribute('height', size);
                if (className) element.setAttribute('class', className);
                element.setAttribute('stroke-width', '2');
                return <span dangerouslySetInnerHTML={{ __html: element.outerHTML }} style={{ display: 'inline-flex', verticalAlign: 'middle' }} />;
            }
        } catch (e) {
            console.error(e);
        }

        return null;
    };

        const bubbleStroke = isDark ? "url(#bubbleMonoConfig)" : "url(#bubbleGradConfig)";

                        <stop offset="100%" stopColor="#F43F5E" />

    const Card = ({ children, className = "" }) => (

            <div className={`relative top-0.5 inline-flex items-center rounded-full px-3 py-1 text-xs font-bold ${tones[tone] || tones.indigo}`}>

        const getCurrentJson = () => {

            if (activeJsonTab === "styles") return stylesJson;

            return presetsJson;

            else if (activeJsonTab === "mentions") setMentionsJson(val);

            const blob = new Blob([getCurrentJson()], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = `${activeJsonTab}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
        };

        return (
            <div className="space-y-6">
                <Card className="p-6 md:p-8">
                    <div className="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
                        <SectionHeading
                            eyebrow="Import / Export"
                            title="JSON Console"
                            icon="file-json"
                        />
                        <div className="flex flex-wrap gap-2">
                            <DeleteButton
                                onDelete={onReset}
                                label={<><IconWrapper name="rotate-ccw" size={14} className="mr-1 inline" /> Reset All</>}
                                size="md"
                            />
                            <Button onClick={() => handleImport(activeJsonTab)} variant="secondary">
                                <IconWrapper name="upload" size={16} /> Load from Text
                            </Button>
                            <Button onClick={saveCurrentJsonToFile} variant="secondary">
                                <IconWrapper name="download" size={16} /> Save to File
                            </Button>
                            <Button onClick={() => copyToClipboard(activeJsonTab)} variant="primary">
                                {copySuccess === activeJsonTab ? <IconWrapper name="check" size={16} /> : <IconWrapper name="copy" size={16} />}
                                {copySuccess === activeJsonTab ? "Copied!" : "Copy to Clipboard"}
                            </Button>
                        </div>
                    </div>
                </Card>

                <Card className="p-4 md:p-5">
                    <div className="flex flex-wrap gap-2">
                        {jsonTabs.map(tab => (
                            <TabButton
                                key={tab.id}
                                active={activeJsonTab === tab.id}
                                onClick={() => setActiveJsonTab(tab.id)}
                                icon={tab.icon}
                                label={tab.label}
                                compactLabel={tab.label.replace('.json', '')}
                            />
                        ))}
                    </div>
                </Card>

                {error && (
                    <div className="rounded-[24px] border border-red-200 bg-red-50 px-5 py-4 text-sm font-medium text-red-700 shadow-sm dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300">
                        {error}
                    </div>
                )}

                <Card className="overflow-hidden">
                    <div className="flex items-center justify-between border-b border-slate-200/80 bg-gradient-to-r from-slate-50 to-white px-6 py-4 dark:border-slate-700 dark:from-slate-900/70 dark:to-slate-900/20">
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-[0.22em] text-indigo-500">Active File</div>
                            <div className="mt-1 text-sm font-bold text-slate-800 dark:text-white">{activeJsonTab}.json</div>
                        </div>
                    </div>
                    <textarea
                        className="min-h-[620px] w-full resize-y border-0 bg-slate-950 px-6 py-5 font-mono text-sm leading-6 text-slate-100 outline-none focus:ring-4 focus:ring-indigo-500/20"
                        value={getCurrentJson()}
                        onChange={(e) => setCurrentJson(e.target.value)}
                        spellCheck="false"
                    />
                </Card>
            </div>
        );
    };

    function ConfigEditor() {
        const [config, setConfig] = useState(cloneJson(DEFAULT_CONFIG));
        const [styles, setStyles] = useState(cloneJson(DEFAULT_STYLES));
        const [mentions, setMentions] = useState(cloneJson(DEFAULT_MENTIONS));
        const [presets, setPresets] = useState(cloneJson(DEFAULT_PRESETS));
        const playerProfileCacheRef = useRef({});
        const [theme, setTheme] = useState(getInitialTheme);

        const [activeTab, setActiveTab] = useState("global");
        const [activeJsonTab, setActiveJsonTab] = useState("config");

        const [configJson, setConfigJson] = useState("");
        const [stylesJson, setStylesJson] = useState("");
        const [mentionsJson, setMentionsJson] = useState("");
        const [presetsJson, setPresetsJson] = useState("");

        const [copySuccess, setCopySuccess] = useState(null);
        const [error, setError] = useState(null);

        useEffect(() => {
            setConfigJson(JSON.stringify(config, null, 2));
        }, [config]);

        useEffect(() => {
            setStylesJson(JSON.stringify(styles, null, 2));
        }, [styles]);

        useEffect(() => {
            setMentionsJson(JSON.stringify(mentions, null, 2));
        }, [mentions]);

        useEffect(() => {
            setPresetsJson(JSON.stringify(presets, null, 2));
        }, [presets]);

        useEffect(() => {
            applyTheme(theme);
            try {
                localStorage.setItem(THEME_STORAGE_KEY, theme);
            } catch (error) {
                console.warn('Could not persist theme preference.', error);
            }
        }, [theme]);

        const normalizeConfigData = (rawConfig = {}) => {
            const parsed = { ...rawConfig };

            if (parsed.mentionColor && !parsed.defaultTeamColor) {
                parsed.defaultTeamColor = parsed.mentionColor;
            }
            delete parsed.mentionColor;

            const migratedPresets = {};
            if (parsed.colors !== undefined) {
                migratedPresets.colors = parsed.colors;
                delete parsed.colors;
            }
            if (parsed.atlas !== undefined) {
                migratedPresets.atlas = parsed.atlas;
                delete parsed.atlas;
            }
            if (parsed.whitelist !== undefined) {
                migratedPresets.whitelist = parsed.whitelist;
                delete parsed.whitelist;
            }
            if (parsed.prefixes !== undefined) {
                migratedPresets.prefixes = parsed.prefixes;
                delete parsed.prefixes;
            }

            return {
                config: {
                    ...cloneJson(DEFAULT_CONFIG),
                    ...parsed,
                    version: CONFIG_VERSION,
                    bannedPlayerList: Array.isArray(parsed.bannedPlayerList) ? parsed.bannedPlayerList : [],
                    notificationOffPlayerList: Array.isArray(parsed.notificationOffPlayerList) ? parsed.notificationOffPlayerList : []
                },
                migratedPresets
            };
        };

        const addUuidEntry = (key, entry, duplicateMessage) => {
            if (!entry) return;
            if (!UUID_PATTERN.test(entry)) {
                alert("Invalid UUID format.");
                return;
            }
            if ((config[key] || []).includes(entry)) {
                alert(duplicateMessage);
                return;
            }
            setConfig(prev => ({
                ...prev,
                [key]: [...(prev[key] || []), entry]
            }));
        };

        const removeUuidEntry = (key, entry) => {
            setConfig(prev => ({
                ...prev,
                [key]: (prev[key] || []).filter((value) => value !== entry)
            }));
        };

        const fetchPlayerProfile = async (uuid) => {
            const normalizedUuid = uuid.replace(/-/g, "");
            const cachedProfile = playerProfileCacheRef.current[normalizedUuid];
            if (cachedProfile) return cachedProfile;

            const profileApis = [
                {
                    label: "PlayerDB",
                    url: `https://playerdb.co/api/player/minecraft/${normalizedUuid}`,
                    pickName: (json) => json?.data?.player?.username || json?.data?.player?.raw_id
                },
                {
                    label: "Ashcon",
                    url: `https://api.ashcon.app/mojang/v2/user/${normalizedUuid}`,
                    pickName: (json) => json?.username || json?.name
                },
                {
                    label: "Mojang Session Server",
                    url: `https://sessionserver.mojang.com/session/minecraft/profile/${normalizedUuid}`,
                    pickName: (json) => json?.name
                }
            ];

            let resolvedName = null;
            const failures = [];

            for (const api of profileApis) {
                try {
                    const response = await fetch(api.url, {
                        method: "GET",
                        headers: { "Accept": "application/json" }
                    });

                    if (!response.ok) {
                        failures.push(`${api.label}: HTTP ${response.status}`);
                        continue;
                    }

                    const profileJson = await response.json();
                    const candidateName = api.pickName(profileJson);
                    if (candidateName) {
                        resolvedName = candidateName;
                        break;
                    }

                    failures.push(`${api.label}: empty response`);
                } catch (error) {
                    failures.push(`${api.label}: ${error?.message || "request failed"}`);
                }
            }

            if (!resolvedName) {
                throw new Error(`Could not resolve this UUID. ${failures.join(" | ")}`);
            }

            const profile = {
                uuid,
                normalizedUuid,
                name: resolvedName,
                headUrl: `https://mc-heads.net/head/${normalizedUuid}/96`,
                avatarUrl: `https://mc-heads.net/avatar/${normalizedUuid}/64`
            };

            playerProfileCacheRef.current[normalizedUuid] = profile;
            return profile;
        };

        const handleImport = (fileType) => {
            try {
                if (fileType === "config") {
                    const parsed = JSON.parse(configJson);
                    const { config: normalizedConfig, migratedPresets } = normalizeConfigData(parsed);

                    if (Object.keys(migratedPresets).length > 0) {
                        setPresets(prev => ({
                            ...prev,
                            ...migratedPresets,
                        }));
                    }
                    setConfig(normalizedConfig);
                } else if (fileType === "styles") {
                    const parsed = JSON.parse(stylesJson);
                    if (parsed.stylingRules) {
                        Object.keys(parsed.stylingRules).forEach(key => {
                            parsed.stylingRules[key].forEach(rule => {
                                if (rule.comment === undefined) rule.comment = "";
                            });
                        });
                    }
                    setStyles({
                        ...cloneJson(DEFAULT_STYLES),
                        ...parsed,
                        stylingRules: parsed.stylingRules ?? {}
                    });
                } else if (fileType === "mentions") {
                    const parsed = JSON.parse(mentionsJson);
                    if (parsed.mentionRules) {
                        Object.keys(parsed.mentionRules).forEach(key => {
                            parsed.mentionRules[key].forEach(rule => {
                                if (rule.cooldown === undefined) rule.cooldown = 0;
                                if (rule.onlyTarget === undefined) rule.onlyTarget = false;
                                if (rule.sound && typeof rule.sound === 'string') {
                                    rule.sound = { id: rule.sound, category: "UI", volume: 1.0, pitch: rule.pitch || 1.0 };
                                    delete rule.pitch;
                                }
                                if (rule.comment === undefined) rule.comment = "";
                            });
                        });
                    }
                    setMentions({
                        ...cloneJson(DEFAULT_MENTIONS),
                        ...parsed,
                        mentionRules: parsed.mentionRules ?? {}
                    });
                } else if (fileType === "presets") {
                    const parsed = JSON.parse(presetsJson);
                    if (parsed.colorPreset && parsed.colors === undefined) {
                        parsed.colors = parsed.colorPreset;
                        delete parsed.colorPreset;
                    }
                    if (parsed.atlasPreset && parsed.atlas === undefined) {
                        parsed.atlas = parsed.atlasPreset;
                        delete parsed.atlasPreset;
                    }
                    if (parsed.colors === undefined) parsed.colors = {};
                    if (parsed.atlas === undefined) parsed.atlas = {};
                    if (parsed.whitelist === undefined) parsed.whitelist = [];
                    if (parsed.prefixes === undefined) parsed.prefixes = {};
                    setPresets(parsed);
                }
                setError(null);
                alert(`${fileType}.json loaded successfully!`);
            } catch (e) {
                setError("Invalid JSON: " + e.message);
            }
        };

        const handleReset = () => {
            setConfig(cloneJson(DEFAULT_CONFIG));
            setStyles(cloneJson(DEFAULT_STYLES));
            setMentions(cloneJson(DEFAULT_MENTIONS));
            setPresets(cloneJson(DEFAULT_PRESETS));
            alert("All configurations reset to defaults.");
        };

        const copyToClipboard = (fileType) => {
            let content;
            if (fileType === "config") content = JSON.stringify(config, null, 2);
            else if (fileType === "styles") content = JSON.stringify(styles, null, 2);
            else if (fileType === "mentions") content = JSON.stringify(mentions, null, 2);
            else content = JSON.stringify(presets, null, 2);

            navigator.clipboard.writeText(content);
            setCopySuccess(fileType);
            setTimeout(() => setCopySuccess(null), 2000);
        };

        const updateGlobal = (key, val) => setConfig(prev => ({ ...prev, [key]: val }));

        const addPreset = (name) => {
            if (!name) return;
            if (presets.colors && presets.colors[name]) {
                alert("Preset already exists!");
                return;
            }
            setPresets(prev => ({
                ...prev,
                colors: { ...(prev.colors || {}), [name]: "#FFFFFF" }
            }));
        };

        const removePreset = (key) => {
            const newPresets = { ...presets.colors };
            delete newPresets[key];
            setPresets(prev => ({ ...prev, colors: newPresets }));
        };

        const updatePreset = (key, val) => {
            setPresets(prev => ({
                ...prev,
                colors: { ...prev.colors, [key]: val }
            }));
        };

        const addAtlasPreset = (name) => {
            if (!name) return;
            if (presets.atlas && presets.atlas[name]) {
                alert("Atlas preset already exists!");
                return;
            }
            setPresets(prev => ({
                ...prev,
                atlas: { ...(prev.atlas || {}), [name]: { atlas: "minecraft:gui", sprite: "" } }
            }));
        };

        const removeAtlasPreset = (key) => {
            const newPresets = { ...presets.atlas };
            delete newPresets[key];
            setPresets(prev => ({ ...prev, atlas: newPresets }));
        };

        const updateAtlasPreset = (key, field, val) => {
            setPresets(prev => ({
                ...prev,
                atlas: {
                    ...prev.atlas,
                    [key]: { ...prev.atlas[key], [field]: val }
                }
            }));
        };

        const addWhitelist = (entry) => {
            if (!entry) return;
            if ((presets.whitelist || []).includes(entry)) {
                alert("Whitelist entry already exists!");
                return;
            }
            setPresets(prev => ({ ...prev, whitelist: [...(prev.whitelist || []), entry] }));
        };

        const removeWhitelist = (entry) => {
            setPresets(prev => ({
                ...prev,
                whitelist: (prev.whitelist || []).filter((v) => v !== entry)
            }));
        };

        const addPrefix = (key) => {
            if (!key) return;
            if (presets.prefixes && presets.prefixes[key] !== undefined) {
                alert("Prefix already exists!");
                return;
            }
            setPresets(prev => ({
                ...prev,
                prefixes: { ...(prev.prefixes || {}), [key]: "" }
            }));
        };

        const removePrefix = (key) => {
            const newPrefixes = { ...(presets.prefixes || {}) };
            delete newPrefixes[key];
            setPresets(prev => ({ ...prev, prefixes: newPrefixes }));
        };

        const updatePrefix = (key, val) => {
            setPresets(prev => ({
                ...prev,
                prefixes: { ...(prev.prefixes || {}), [key]: val }
            }));
        };

        const addBannedPlayer = (entry) => addUuidEntry('bannedPlayerList', entry, "Banned player UUID already exists!");
        const removeBannedPlayer = (entry) => removeUuidEntry('bannedPlayerList', entry);
        const addNotificationOffPlayer = (entry) => addUuidEntry('notificationOffPlayerList', entry, "Notification-off player UUID already exists!");
        const removeNotificationOffPlayer = (entry) => removeUuidEntry('notificationOffPlayerList', entry);

        const updateStyleRuleList = (permissionKey, newRules) => {
            setStyles(prev => ({
                ...prev,
                stylingRules: {
                    ...prev.stylingRules,
                    [permissionKey]: newRules
                }
            }));
        };

        const addStylePermissionGroup = (key) => {
            if (!key) return;
            if (styles.stylingRules[key]) {
                alert("This permission group already exists!");
                return;
            }
            setStyles(prev => ({
                ...prev,
                stylingRules: { ...prev.stylingRules, [key]: [] }
            }));
        };

        const removeStylePermissionGroup = (key) => {
            setStyles(prev => {
                const newRules = { ...prev.stylingRules };
                delete newRules[key];
                return { ...prev, stylingRules: newRules };
            });
        };

        const updateMentionRuleList = (permissionKey, newRules) => {
            setMentions(prev => ({
                ...prev,
                mentionRules: {
                    ...prev.mentionRules,
                    [permissionKey]: newRules
                }
            }));
        };

        const addMentionPermissionGroup = (key) => {
            if (!key) return;
            if (mentions.mentionRules[key]) {
                alert("This permission group already exists!");
                return;
            }
            setMentions(prev => ({
                ...prev,
                mentionRules: { ...prev.mentionRules, [key]: [] }
            }));
        };

        const removeMentionPermissionGroup = (key) => {
            setMentions(prev => {
                const newRules = { ...prev.mentionRules };
                delete newRules[key];
                return { ...prev, mentionRules: newRules };
            });
        };

        const addPermissionGroup = (category, key) => {
            if (category === 'stylingRules') addStylePermissionGroup(key);
            else if (category === 'mentionRules') addMentionPermissionGroup(key);
        };

        const removePermissionGroup = (category, key) => {
            if (category === 'stylingRules') removeStylePermissionGroup(key);
            else if (category === 'mentionRules') removeMentionPermissionGroup(key);
        };

        const updateRuleList = (category, permissionKey, newRules) => {
            if (category === 'stylingRules') updateStyleRuleList(permissionKey, newRules);
            else if (category === 'mentionRules') updateMentionRuleList(permissionKey, newRules);
        };
        const tabs = [
            { id: "global", label: "Global Settings", compactLabel: "Global", icon: "settings" },
            { id: "styling", label: "Styling Rules", compactLabel: "Styling", icon: "message-square" },
            { id: "mention", label: "Mention Rules", compactLabel: "Mention", icon: "at-sign" },
            { id: "json", label: "Import / Export", compactLabel: "JSON", icon: "file-json" },
        ];

        const stylingRuleCount = Object.values(styles.stylingRules || {}).reduce((sum, rules) => sum + rules.length, 0);
        const mentionRuleCount = Object.values(mentions.mentionRules || {}).reduce((sum, rules) => sum + rules.length, 0);
        const presetCount = Object.keys(presets.colors || {}).length + Object.keys(presets.atlas || {}).length;
        const activeTabMeta = tabs.find(tab => tab.id === activeTab);
        const isDarkMode = theme === 'dark';

        return (
            <div className="relative min-h-screen overflow-hidden bg-[radial-gradient(circle_at_top_right,_rgba(99,102,241,0.16),_transparent_24%),radial-gradient(circle_at_top_left,_rgba(244,63,94,0.10),_transparent_18%),linear-gradient(180deg,_#f8fafc_0%,_#eef2ff_100%)] font-sans text-slate-900 dark:bg-[radial-gradient(circle_at_top_right,_rgba(99,102,241,0.18),_transparent_24%),radial-gradient(circle_at_top_left,_rgba(168,85,247,0.12),_transparent_18%),linear-gradient(180deg,_#020617_0%,_#0f172a_100%)] dark:text-slate-100">
                <div className="pointer-events-none absolute -left-20 top-20 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl dark:bg-indigo-700/20" />
                <div className="pointer-events-none absolute -right-20 top-40 h-80 w-80 rounded-full bg-fuchsia-200/30 blur-3xl dark:bg-fuchsia-700/15" />

                <div className="relative mx-auto max-w-[92rem] px-4 py-8 md:px-6 md:py-10">
                    <header className="mb-8 space-y-6">
                        <Card className="overflow-visible p-6 md:p-8">
                            <div className="absolute right-0 top-0 h-52 w-52 rounded-full bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 blur-3xl opacity-80 dark:from-indigo-900/40 dark:via-purple-900/30 dark:to-pink-900/20" />
                            <div className="relative flex flex-col gap-6">
                                <div className="flex flex-col gap-6 md:flex-row md:items-start md:justify-between">
                                    <div className="flex flex-col gap-6 md:flex-row md:items-center">
                                        <div className="flex h-24 w-24 items-center justify-center rounded-[2rem] border border-white/70 bg-white/90 shadow-glow dark:border-slate-700 dark:bg-slate-900/90">
                                            <BrandMark size={72} theme={theme} />
                                        </div>
                                        <div>
                                            <p className="text-xs font-semibold uppercase tracking-[0.26em] text-indigo-500">Embellish Chat Toolkit</p>
                                            <h1 className="mt-2 inline-block pb-2 text-4xl font-black leading-[1.2] tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-500 md:text-5xl dark:from-slate-100 dark:via-slate-200 dark:to-slate-400">
                                                config generator
                                            </h1>
                                            <div className="mt-3 inline-flex items-center rounded-full bg-white/80 px-3 py-1 text-xs font-bold text-slate-600 shadow-sm dark:bg-slate-900/80 dark:text-slate-300">
                                                {activeTabMeta?.label}
                                            </div>
                                        </div>
                                    </div>
                                    <Button
                                        onClick={() => setTheme(isDarkMode ? 'light' : 'dark')}
                                        variant="secondary"
                                        className="self-start"
                                    >
                                        <IconWrapper name={isDarkMode ? 'sun' : 'moon'} size={16} />
                                        {isDarkMode ? 'Light mode' : 'Dark mode'}
                                    </Button>
                                </div>
                                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                                    <StatPill label="Version" value={config.version || CONFIG_VERSION} accent="indigo" />
                                    <StatPill label="Style Rules" value={stylingRuleCount} accent="emerald" />
                                    <StatPill label="Mention Rules" value={mentionRuleCount} accent="amber" />
                                    <StatPill label="Presets" value={presetCount} accent="slate" />
                                </div>
                            </div>
                        </Card>

                        <Card className="p-3 md:p-4">
                            <div className="flex flex-wrap gap-2">
                                {tabs.map(tab => (
                                    <TabButton
                                        key={tab.id}
                                        active={activeTab === tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        icon={tab.icon}
                                        label={tab.label}
                                        compactLabel={tab.compactLabel}
                                    />
                                ))}
                            </div>
                        </Card>
                    </header>

                    <main className="space-y-6 pb-20">
                        {activeTab === 'global' && (
                            <GlobalView
                                config={config}
                                presets={presets}
                                updateGlobal={updateGlobal}
                                addPreset={addPreset}
                                removePreset={removePreset}
                                updatePreset={updatePreset}
                                addAtlasPreset={addAtlasPreset}
                                removeAtlasPreset={removeAtlasPreset}
                                updateAtlasPreset={updateAtlasPreset}
                                addWhitelist={addWhitelist}
                                removeWhitelist={removeWhitelist}
                                addPrefix={addPrefix}
                                removePrefix={removePrefix}
                                updatePrefix={updatePrefix}
                                addBannedPlayer={addBannedPlayer}
                                removeBannedPlayer={removeBannedPlayer}
                                addNotificationOffPlayer={addNotificationOffPlayer}
                                removeNotificationOffPlayer={removeNotificationOffPlayer}
                                fetchPlayerProfile={fetchPlayerProfile}
                            />
                        )}
                        {activeTab === 'styling' && (
                            <StylingView
                                config={styles}
                                addPermissionGroup={(cat, key) => addPermissionGroup('stylingRules', key)}
                                removePermissionGroup={(cat, key) => removePermissionGroup('stylingRules', key)}
                                updateRuleList={(cat, permKey, rules) => updateRuleList('stylingRules', permKey, rules)}
                            />
                        )}
                        {activeTab === 'mention' && (
                            <MentionView
                                config={mentions}
                                addPermissionGroup={(cat, key) => addPermissionGroup('mentionRules', key)}
                                removePermissionGroup={(cat, key) => removePermissionGroup('mentionRules', key)}
                                updateRuleList={(cat, permKey, rules) => updateRuleList('mentionRules', permKey, rules)}
                            />
                        )}
                        {activeTab === 'json' && (
                            <JsonView
                                configJson={configJson}
                                setConfigJson={setConfigJson}
                                stylesJson={stylesJson}
                                setStylesJson={setStylesJson}
                                mentionsJson={mentionsJson}
                                setMentionsJson={setMentionsJson}
                                presetsJson={presetsJson}
                                setPresetsJson={setPresetsJson}
                                handleImport={handleImport}
                                copyToClipboard={copyToClipboard}
                                copySuccess={copySuccess}
                                error={error}
                                onReset={handleReset}
                                activeJsonTab={activeJsonTab}
                                setActiveJsonTab={setActiveJsonTab}
                            />
                        )}
                    </main>

                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConfigEditor />);
</script>
</body>
</html>
