<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Embellish Chat Icon</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="flex items-center justify-center min-h-screen bg-gray-50 text-gray-800">
        <div class="p-12 bg-white rounded-[2rem] shadow-2xl flex flex-col items-center gap-8 border border-gray-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 blur-2xl opacity-70"></div>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 32 32" width="160" height="160" fill="none" class="overflow-visible">
                <defs>
                    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4F46E5" />
                        <stop offset="100%" stop-color="#9333EA" />
                    </linearGradient>
                    <linearGradient id="sparkleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#F59E0B" />
                        <stop offset="100%" stop-color="#F43F5E" />
                    </linearGradient>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F43F5E" flood-opacity="0.4" />
                    </filter>
                </defs>
                <path d="M8 8h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-1.5l-3.5 3v-3H8a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" stroke="#E5E7EB" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                <path d="M16 4H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1.5v3.5L9 16h7a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" stroke="url(#bubbleGrad)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M6 9h7" stroke="url(#bubbleGrad)" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 13h4" stroke="url(#bubbleGrad)" stroke-width="2" stroke-linecap="round"/>
                <path d="M19 1l1.5 3.5L24 6l-3.5 1.5L19 11l-1.5-3.5L14 6l3.5-1.5z" stroke="url(#sparkleGrad)" stroke-width="1.8" fill="url(#sparkleGrad)" stroke-linejoin="round" filter="url(#glow)"/>
                <path d="M4 1l.7 1.8L6.5 3.5 4.7 4.2 4 6l-.7-1.8L1.5 3.5l1.8-.7z" stroke="url(#sparkleGrad)" stroke-width="1.5" fill="url(#sparkleGrad)" stroke-linejoin="round"/>
                <path d="M22 13l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z" stroke="url(#sparkleGrad)" stroke-width="1.5" fill="url(#sparkleGrad)" stroke-linejoin="round"/>
            </svg>
            <div class="text-center z-10 flex flex-col items-center gap-4">
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">embellish chat</h1>
                <button onclick="downloadPNG()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-full shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    PNG로 저장
                </button>
            </div>
        </div>

        <script>
            function downloadPNG() {
            const svgElement = document.querySelector('svg');
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
            ctx.drawImage(img, 0, 0, 512, 512);
            const pngUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'embellish_chat.png';
            link.href = pngUrl;
            link.click();
            };

            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
            }
        </script>
    </body>
</html>
